# Pokémier (2026-11-20): builds java-cef for each platform and publishes the archives as a GitHub Release whose tag is "jcef-" + the
# commit hash (GitHub refuses tags of 40 hex characters; the original uploaded them to CinemaMod's S3 bucket). MCEF (Pokémier build) downloads them from:
#   https://github.com/<owner>/<repo>/releases/download/jcef-<commit>/<platform>.tar.gz   (and .tar.gz.sha256)
# The .sha256 files have the same form on every platform: "<hash>  <file>".
#
# Windows uses Python 3.10 and Java 17, as Linux does: the configure step runs java-cef's Python scripts (the version header,
# clang-format from Google Storage with gsutil), which fail with the newer Python of the Windows runner.
# No macOS: the CEF build java-cef downloads (CinemaMod's server, branch 6478) does not exist for macOS (HTTP 403), and the
# macos-13 runners the original used are gone.
#
# arm64 builds on GitHub's arm64 runners (free for public repositories), each with an arm64 JDK. Cross-compiling on x86 linked
# the x86 libraries of CEF and of the JDK: the Windows arm64 build failed, and the Linux "arm64" archive was x86.
name: Build java-cef

on:
  push:
    branches:
      - pokemier
  workflow_dispatch:

permissions:
  contents: write

jobs:
  java-cef-linux:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: amd64
            runner: ubuntu-22.04
          - platform: arm64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install deps and build
        run: |
          sudo apt update
          sudo apt install build-essential g++ cmake ninja-build openjdk-17-jdk python3 libgtk2.0-dev -y
          mkdir jcef_build && cd jcef_build
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-$(dpkg --print-architecture)
          export JAVA_INCLUDE_PATH=$JAVA_HOME/include
          cmake -G "Ninja" -DPROJECT_ARCH=${{ matrix.platform }} -DCMAKE_BUILD_TYPE=Release ..
          ninja -j4
          mv native/Release linux_${{ matrix.platform }}
          strip linux_${{ matrix.platform }}/libcef.so
          tar -czf linux_${{ matrix.platform }}.tar.gz linux_${{ matrix.platform }}
          sha256sum linux_${{ matrix.platform }}.tar.gz > linux_${{ matrix.platform }}.tar.gz.sha256
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jcef-${{ github.sha }}
          name: java-cef ${{ github.sha }}
          files: |
            jcef_build/linux_${{ matrix.platform }}.tar.gz
            jcef_build/linux_${{ matrix.platform }}.tar.gz.sha256

  java-cef-windows:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python: x64 on both (on arm64 it runs emulated; there is no Python 3.10 for Windows arm64).
          # Java: Temurin 17 has no Windows arm64 build, Microsoft's OpenJDK 17 does.
          - platform: amd64
            runner: windows-2022
            msvc: amd64
            java: temurin
            jarch: x64
          - platform: arm64
            runner: windows-11-arm
            msvc: arm64
            java: microsoft
            jarch: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.10'
          architecture: x64
      - uses: actions/setup-java@v4
        with:
          distribution: ${{ matrix.java }}
          java-version: '17'
          architecture: ${{ matrix.jarch }}
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc }}
      - name: Build
        env:
          PYTHON_EXECUTABLE: ${{ steps.python.outputs.python-path }}
        run: |
          # the arm64 runner may lack CMake or Ninja outside Visual Studio
          if (-not (Get-Command cmake -ErrorAction SilentlyContinue)) { python -m pip install cmake }
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { python -m pip install ninja }
          python --version
          cmake --version
          mkdir jcef_build && cd jcef_build
          cmake -G "Ninja" -DPROJECT_ARCH=${{ matrix.platform }} -DCMAKE_BUILD_TYPE=Release ..
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ninja -j4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cd native
          ren Release windows_${{ matrix.platform }}
          cd ..
          move native/windows_${{ matrix.platform }} windows_${{ matrix.platform }}
          tar -czf windows_${{ matrix.platform }}.tar.gz windows_${{ matrix.platform }}
          $hash = (Get-FileHash -Algorithm SHA256 -Path "windows_${{ matrix.platform }}.tar.gz").Hash.ToLower()
          Set-Content -NoNewline -Encoding ascii -Path "windows_${{ matrix.platform }}.tar.gz.sha256" -Value "$hash  windows_${{ matrix.platform }}.tar.gz"
      - name: Show the configure log
        if: failure()
        run: |
          Get-Content jcef_build/CMakeFiles/CMakeOutput.log -Tail 60 -ErrorAction SilentlyContinue
          Get-Content jcef_build/CMakeFiles/CMakeError.log -Tail 60 -ErrorAction SilentlyContinue
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jcef-${{ github.sha }}
          name: java-cef ${{ github.sha }}
          files: |
            jcef_build/windows_${{ matrix.platform }}.tar.gz
            jcef_build/windows_${{ matrix.platform }}.tar.gz.sha256
